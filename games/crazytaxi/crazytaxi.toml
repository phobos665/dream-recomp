# Crazy Taxi (USA), MK-51035. Per-game configuration for dream-translate (docs/game-config.md).
# Every value here was measured from the owner's disc; see checklist-report.md for how.

[game]
id = "crazytaxi"
title = "Crazy Taxi"
region = "USA"
product = "MK-51035"

[disc]
image = "../crazytaxi.chd"           # the owner's dump, gitignored; mounted by the launcher
# SHA-1 of the plain 1ST_READ.BIN this config was measured against (GD-ROM dumps store it plain).
sha1_1st_read = "8b5bd2a2380799e4e1de46cf801c352fd90c2f3e"

[binary]
path = "extracted/fs/1ST_READ.BIN"   # written by `dcdisc extract`, gitignored
load_address = 0x8C010000            # where the BIOS loads the file
link_address = 0x0C010000            # what the literal pools assume (P0 alias of the same RAM)
entry = 0x8C010000

# The first 0x100 bytes are a loader that copies the Katana startup stub to 0x8C004000 and jumps
# there; the stub sets FPSCR 0x00040001, fills the system variables at 0x8C00F400 and enters the
# program. The translator emits the copy as its own unit viewed at the destination address.
[[relocations]]
source = 0x0C010100
size = 0x3F00
dest = 0x8C004000
entries = [0x8C004000, 0x8C004070]   # the loader enters at +0 and again at +0x70 (measured by the launcher)

# The interrupt entry at VBR+0x600 (0x8C00FA00) and the RTE stub after it hold two different
# pieces of code over the game's life: the startup stub installs a small pair (patched literals)
# that hands the first task to the main program, then Katana's runtime installs its own (taken on
# every interrupt: 556 VBlanks in 300 frames). All three are overlays: the runtime dispatches to
# whichever translation matches the bytes currently in RAM. The exception stub at VBR+0
# (0x8C00F400) is installed once.
[[relocations]]
source = 0x0C010D40
size = 0x20
dest = 0x8C00FA00
entries = [0x8C00FA00]
no_fold = true
overlay = true

[[relocations]]
source = 0x0C010D20
size = 0x10
dest = 0x8C00FA20
entries = [0x8C00FA20]
no_fold = true
overlay = true

[[relocations]]
source = 0x0C16BBB8
size = 0x58
dest = 0x8C00FA00
entries = [0x8C00FA00, 0x8C00FA20]
no_fold = true
overlay = true

[[relocations]]
source = 0x0C16BC14
size = 0x34
dest = 0x8C00F400
entries = [0x8C00F400]

[functions]
symbols = "symbols.tsv"   # names from the Ghidra FID pass (dream-translate symbols)
pointers = true
sweep = true
# The one entry discovery genuinely cannot reach: the nop-padded main entry, which no static pass
# finds and which the program jumps to rather than calls. Everything else that a run reports as an
# untranslated target is a jump into the middle of a function that is already compiled, and the
# runtime resolves those itself (runtime/src/sh4/abi_bare.cpp, call_indirect). Naming one of those
# here makes it a discovery seed, which truncates the function containing it and silently corrupts
# what that function computes.
extra = [0x0C020000, 0x0C081476, 0x0C161046, 0x0C161050, 0x0C161118, 0x0C16112A]
# The 0x0C161xxx four are on the memory-card path. They sit inside fn_0c15b0c0, so a *call* through
# a register reaches them via call_indirect -- but they are reached by non-local *returns*, and
# resume_at can only re-enter a function at one of its own block starts. These are not block
# starts, so nothing covers them and the run faults at frame 27, which is exactly what this config
# recorded before they were dropped. Unlike the 0x0C081xxx group they translate correctly when
# seeded, so seeding is the right answer for them and the wrong one for those.
# 0x0C081476 is a real function entry, not a jump into the middle of one: fn_0c081200 ends cleanly
# at the rts/delay-slot pair 0x0c081472..0x0c081474, and a fresh block starts on the next
# instruction. Nothing references it statically -- it is only ever reached through a register -- so
# discovery leaves 0x0c081476..0x0c081560 as a hole, and call_indirect cannot cover it either,
# because there is no containing function for find_containing to land in. It has to be a seed.
#
# Still NOT here, and for the opposite reason: 0x0C081494, 0x0C0814DE, 0x0C081E56, 0x0C081E76.
# Those are inside the block this seed starts, so naming them would split it and truncate what
# encloses them -- the 152 texture decode failures against none measured on 2026-09-13. The
# runtime resolves that class itself (runtime/src/sh4/abi_bare.cpp, call_indirect).
# Left to the development interpreter, which runs it correctly, because its translation does not.
# With a memory card attached the title reaches this function and it computes addresses from
# floating-point values -- an unmapped read16 of 0x420187ac with r5 = 0x420187a0 and r6 =
# 0x45bea4d3, both float bit patterns, at frame 6093 -- after which the guest follows garbage and
# lands on an unimplemented instruction. Excluding this one function and nothing else takes the
# card path from that fault to 9002 frames with 0 unmapped accesses, which is exactly what a fully
# interpreted run produces. Remove this line once the emitter defect behind it is found; the
# oracle in tools/oracle is the way to find it.
exclude = [0x0C07B760]

[hle]
# guest address = "runtime handler"; filled in Phase 2/3 (GD-ROM, ADX, VMU library entry points)

[hooks]
# guest address = "hook name"; Phase 3
