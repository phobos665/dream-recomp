# Tech Romancer (USA), T1208N. A second title, to find out how much of the toolchain is general and
# how much was fitted to Crazy Taxi (docs/game-config.md).
#
# Deliberately minimal: no relocations, no symbols, no hooks. Everything here was read off the disc
# by `dcdisc inspect`. What breaks with only this much is the interesting result.

[game]
id = "techromancer"
title = "Tech Romancer"
region = "USA"
product = "T1208N"

[disc]
image = "../techromancer.chd"        # the owner's dump, gitignored
# SHA-1 of the plain 1ST_READ.BIN this config was measured against.
sha1_1st_read = "c1cb784599b12ad6268b9df07a87547881dc145e"

[binary]
path = "extracted/fs/1ST_READ.BIN"   # written by `dcdisc extract`, gitignored
load_address = 0x8C010000            # the standard Katana load address
link_address = 0x0C010000            # the P0 alias the literal pools assume
entry = 0x8C010000
